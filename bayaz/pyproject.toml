[project]
name = "bayaz"
version = "0.1.0"
description = "Core library — manifest, sitemap enumeration, paced crawl, raw page store"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "selectolax>=0.4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
