[project]
name = "bayaz-api"
version = "0.1.0"
description = "Read-only HTTP API over the parsed corpus"
requires-python = ">=3.13"
dependencies = [
    "bayaz",
    "fastapi>=0.120.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
bayaz-serving = "bayaz_api.serving:main"

[tool.uv.sources]
bayaz = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
